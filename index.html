<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCarousel Spooler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #0b0d11;
      --surface:   #111318;
      --border:    #1e2229;
      --accent:    #e8ff47;
      --accent2:   #47ffe8;
      --text:      #e4e6ed;
      --muted:     #555d6e;
      --danger:    #ff4757;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    /* — Grid overlay — */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* — Glow blobs — */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .18;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 480px; height: 480px;
      background: var(--accent);
      top: -140px; left: -100px;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 360px; height: 360px;
      background: var(--accent2);
      bottom: -80px; right: -80px;
      animation: drift 18s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    /* — Card — */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 3.5rem 3.5rem;
      box-shadow:
        0 0 0 1px rgba(232,255,71,.05),
        0 32px 80px rgba(0,0,0,.6);
      animation: slideUp .6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* — Badge — */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      background: rgba(232,255,71,.08);
      border: 1px solid rgba(232,255,71,.2);
      border-radius: 999px;
      padding: .3rem .9rem;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.4rem;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1);   }
      50%       { opacity: .4; transform: scale(.6); }
    }

    /* — Title — */
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.02em;
      color: var(--text);
      margin-bottom: .6rem;
    }
    h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-size: .8rem;
      color: var(--muted);
      letter-spacing: .04em;
      margin-bottom: 2.4rem;
    }

    /* — Divider — */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      margin-bottom: 2.4rem;
      opacity: .25;
    }

    /* — Label — */
    label {
      display: block;
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .6rem;
    }

    /* — Textarea — */
    .textarea-wrap {
      position: relative;
      margin-bottom: 1.4rem;
    }
    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      font-family: 'DM Mono', monospace;
      font-size: .9rem;
      color: var(--text);
      line-height: 1.7;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      caret-color: var(--accent);
    }
    textarea::placeholder {
      color: var(--muted);
    }
    textarea:focus {
      border-color: rgba(232,255,71,.45);
      box-shadow: 0 0 0 3px rgba(232,255,71,.08);
    }

    /* character counter */
    .char-count {
      position: absolute;
      bottom: .75rem;
      right: 1rem;
      font-size: .68rem;
      color: var(--muted);
      pointer-events: none;
      transition: color .2s;
    }
    .char-count.warn { color: var(--danger); }

    /* — Button — */
    .btn-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    button[type="submit"] {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--accent);
      color: #0b0d11;
      border: none;
      border-radius: 10px;
      padding: .9rem 2rem;
      font-family: 'Syne', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, background .15s;
      box-shadow: 0 4px 24px rgba(232,255,71,.25);
      flex-shrink: 0;
    }
    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(232,255,71,.4);
    }
    button[type="submit"]:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(232,255,71,.2);
    }
    button[type="submit"] svg {
      transition: transform .2s;
    }
    button[type="submit"]:hover svg {
      transform: translateX(3px);
    }

    /* loading state */
    button[type="submit"].loading {
      pointer-events: none;
      background: #c8dc3f;
    }
    button[type="submit"].loading .btn-text { display: none; }
    button[type="submit"].loading .btn-spinner { display: block; }
    .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(11,13,17,.3);
      border-top-color: #0b0d11;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      font-size: .72rem;
      color: var(--muted);
    }

    /* — Toast — */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent);
      color: #0b0d11;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .85rem;
      padding: .8rem 1.4rem;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(232,255,71,.3);
      z-index: 100;
      transform: translateY(20px);
      opacity: 0;
      transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .35s;
      pointer-events: none;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 540px) {
      .card { padding: 2rem 1.5rem 2.5rem; }
      .btn-wrap { flex-direction: column; align-items: stretch; }
      button[type="submit"] { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      AutoCarousel Spooler
    </div>

    <h1>Feed the <span>Spool.</span></h1>
    <p class="subtitle">Enter your payload below and dispatch it to the carousel queue.</p>

    <div class="divider"></div>

    <form id="spooler-form" novalidate>
      <label for="spool-input">Spool Content</label>

      <div class="textarea-wrap">
        <textarea
          id="spool-input"
          name="spool-input"
          placeholder="Paste or type your content here — the carousel is waiting…"
          maxlength="5000"
          spellcheck="false"
          autocomplete="off"
        ></textarea>
        <span class="char-count" id="char-count">0 / 5000</span>
      </div>

      <div class="btn-wrap">
        <button type="submit" id="submit-btn">
          <span class="btn-spinner"></span>
          <span class="btn-text">
            Submit to Queue
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="#0b0d11" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
        <span class="hint">⌘ + Enter to submit</span>
      </div>
    </form>
  </main>

  <div class="toast" id="toast">✓ Spooled successfully!</div>

  <script>
    const textarea  = document.getElementById('spool-input');
    const counter   = document.getElementById('char-count');
    const form      = document.getElementById('spooler-form');
    const submitBtn = document.getElementById('submit-btn');
    const toast     = document.getElementById('toast');
    const MAX       = 5000;

    // Character counter
    textarea.addEventListener('input', () => {
      const len = textarea.value.length;
      counter.textContent = `${len.toLocaleString()} / ${MAX.toLocaleString()}`;
      counter.classList.toggle('warn', len > MAX * 0.9);
    });

    // Keyboard shortcut
    textarea.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // Submit
    form.addEventListener('submit', e => {
      e.preventDefault();
      const content = textarea.value.trim();
      if (!content) {
        textarea.focus();
        textarea.style.borderColor = 'var(--danger)';
        setTimeout(() => textarea.style.borderColor = '', 1200);
        return;
      }

      // Simulate async dispatch
      submitBtn.classList.add('loading');
      setTimeout(() => {
        submitBtn.classList.remove('loading');

        // Show toast
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);

        // Optionally clear form
        // textarea.value = '';
        // counter.textContent = `0 / ${MAX.toLocaleString()}`;
      }, 1200);
    });
  </script>
</body>
</html>
