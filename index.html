<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCarousel Spooler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #0b0d11;
      --surface:   #111318;
      --border:    #1e2229;
      --accent:    #5ce8c1;
      --accent2:   #00ff84;
      --text:      #e4e6ed;
      --muted:     #555d6e;
      --danger:    #ff4757;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    /* — Grid overlay — */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* — Glow blobs — */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .18;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 480px; height: 480px;
      background: var(--accent);
      top: -140px; left: -100px;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 360px; height: 360px;
      background: var(--accent2);
      bottom: -80px; right: -80px;
      animation: drift 18s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    /* — Card — */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 3.5rem 3.5rem;
      box-shadow:
        0 0 0 1px rgba(232,255,71,.05),
        0 32px 80px rgba(0,0,0,.6);
      animation: slideUp .6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* — Badge — */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 999px;
      padding: .3rem .9rem;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 1.4rem;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1);   }
      50%       { opacity: .4; transform: scale(.6); }
    }

    /* — Title — */
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 1rem;
    }
    h1 span {
      color: var(--accent);
    }

    h1 span2 {
      color: var(--accent2);
    }

    .subtitle {
      font-size: .8rem;
      color: var(--muted);
      letter-spacing: .04em;
      margin-bottom: 0.5rem;
    }

    /* — Divider — */
    .divider {
      height: .35rem;
      background: linear-gradient(90deg, var(--accent2) 0%, transparent 100%);
      margin-bottom: 1.8rem;
      opacity: .75;
      border-radius: 999px;
    }

    /* — Label — */
    label {
      display: block;
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .6rem;
    }

    /* — Textarea — */
    .textarea-wrap {
      position: relative;
      margin-bottom: 1.4rem;
    }
    textarea {
      width: 100%;
      min-height: 280px;
      resize: none;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE 10+ */
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      font-family: 'DM Mono', monospace;
      font-size: .9rem;
      color: var(--text);
      line-height: 1.7;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      caret-color: var(--accent);
    }
    textarea::-webkit-scrollbar {
      display: none;  /* Chrome/Safari */
    }
    textarea::placeholder {
      color: var(--muted);
    }
    textarea:focus {
      border-color: rgba(0, 255, 132, 0.75);
      box-shadow: 0 0 0 3px rgba(79, 79, 79, 0.35);
    }

    /* — Button — */
    .btn-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    button[type="submit"] {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--accent);
      color: #0b0d11;
      border: none;
      border-radius: 10px;
      padding: .9rem 2rem;
      font-family: 'Syne', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, background .15s;
      box-shadow: 0 2px 24px rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }
    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(92, 232, 193, 0.75);
    }
    button[type="submit"]:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(92, 232, 193, 0.75);
    }
    button[type="submit"] svg {
      transition: transform .15s;
      vertical-align: middle;
    }
    button[type="submit"]:hover svg {
      transform: translateX(3px);
    }

    /* loading state */
    button[type="submit"].loading {
      pointer-events: none;
      background: var(--accent2);
    }
    button[type="submit"].loading .btn-text { display: none; }
    button[type="submit"].loading .btn-spinner { display: block; }
    .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(11,13,17,.3);
      border-top-color: #0b0d11;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      font-size: .72rem;
      color: var(--muted);
    }

    /* — Toast — */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent2);
      color: #0b0d11;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .85rem;
      padding: .8rem 1.4rem;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.35);
      z-index: 100;
      transform: translateY(20px);
      opacity: 0;
      transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .35s;
      pointer-events: none;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 540px) {
      .card { padding: 2rem 1.5rem 2.5rem; }
      .btn-wrap { flex-direction: column; align-items: stretch; }
      button[type="submit"] { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      AutoCarousel Spooler
    </div>

    <h1>Complete your <span>Carousel</span> (but <i>way</i> <span2>quicker</span2>)</h1>
    <p class="subtitle">Enter your carousel details below to spool the program</p>

    <div class="divider"></div>

    <form id="spooler-form" novalidate>
      <label for="spool-input">Sign in details</label>

      <div class="textarea-wrap">
        <textarea
          id="spool-input"
          name="spool-input"
          placeholder="placeholder"
          maxlength="5000"
          spellcheck="false"
          autocomplete="off"
        ></textarea>
      </div>

      <div class="btn-wrap">
        <button type="submit" id="submit-btn">
          <span class="btn-spinner"></span>
          <span class="btn-text">
            Submit to Spooler
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="#0b0d11" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </div>
    </form>
  </main>

  <div class="toast" id="toast">✓ Sent successfully!</div>

  <script>
    const PYTHON_SERVER_URL = "wss://uninvited-untoasted-backspace.ngrok-free.dev/ws";
    const socket = new WebSocket(PYTHON_SERVER_URL);

    const disconnectHandler = () => {
      alert("Disconnected from Python server!");
    };

    socket.addEventListener('open', event => {
      alert("Connected to Python server!");
    });

    socket.addEventListener('message', event => {
      alert("Message from Python server: " + event.data);
    });

    socket.addEventListener('close', disconnectHandler);

    socket.addEventListener('error', error => {
      alert("Failed to connect to Python server!");
      socket.removeEventListener('close', disconnectHandler);
    });


    const textarea  = document.getElementById('spool-input');
    const counter   = document.getElementById('char-count');
    const form      = document.getElementById('spooler-form');
    const submitBtn = document.getElementById('submit-btn');
    const toast     = document.getElementById('toast');

    // Keyboard shortcut
    textarea.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // Submit
    form.addEventListener('submit', e => {
      e.preventDefault();
      const content = textarea.value.trim();
      if (!content) {
        textarea.focus();
        textarea.style.borderColor = 'var(--danger)';
        setTimeout(() => textarea.style.borderColor = '', 1200);
        return;
      }

      // Simulate async dispatch
      submitBtn.classList.add('loading');
      setTimeout(() => {
        submitBtn.classList.remove('loading');

        // Show toast
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);

        textarea.value = '';
      }, 500);
    });
  </script>
</body>
</html>
